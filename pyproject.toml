[project]
name = "gatekeeper"
version = "0.1.0"
description = "Lakshmana gatekeeper — LLM-free encoder gate cascade for the Stage 3 judge leg"
readme = "README.md"
requires-python = ">=3.12,<3.13"
license = { file = "LICENSE" }
dependencies = [
    "google-cloud-firestore>=2.19.0",
    "google-cloud-storage>=2.18.0",
    "neo4j>=5.26.0",
    "fastapi>=0.115.0",
    "uvicorn[standard]>=0.32.0",
    # Inference. `tokenizers` is the Rust tokenizer behind a `tokenizer.json` — the same
    # object transformers wraps, without transformers or torch. The runtime image needs
    # exactly these two and none of the model-prep extra: it consumes exported graphs,
    # it never produces them.
    "onnxruntime>=1.20.0",
    "tokenizers>=0.21.0",
    "numpy>=2.1.0",
]

[project.optional-dependencies]
# LK-4 only: the owner-run mirror script. Hugging Face, torch and the ONNX exporters
# never enter the runtime image or CI — the worker reads artifacts from GCS and would
# not know what to do with a checkpoint.
model-prep = [
    "huggingface-hub>=0.26.0",
    "transformers>=4.48.0",
    "optimum[onnxruntime]>=1.24.0",
    "onnx>=1.17.0",
    "onnxruntime>=1.20.0",
    "torch>=2.5.0",
    "sentencepiece>=0.2.2",
]

[project.scripts]
gatekeeper-worker = "gatekeeper.worker.main:main"

[dependency-groups]
dev = [
    "pytest>=8.3.0",
    "ruff>=0.8.0",
    "httpx2>=2.7.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["gatekeeper"]

[tool.ruff]
line-length = 100
target-version = "py312"
src = ["."]

[tool.ruff.lint]
select = ["E", "F", "I", "N", "UP", "B", "SIM", "RUF", "PL", "BLE"]
ignore = ["PLR0911", "PLR0912", "PLR0913"]

[tool.ruff.lint.per-file-ignores]
"tests/*" = ["PLR2004", "PLC0415"]
# The lazy imports in these two are load-bearing, not sloppiness: `google-cloud-storage`
# stays out of the test path, and the whole `model-prep` extra (torch, transformers,
# optimum) must not be importable-at-module-scope or the runtime image would need it.
"gatekeeper/models/loader.py" = ["PLC0415"]
"scripts/prepare_models.py" = ["PLC0415"]
# `onnxruntime` and `tokenizers` are hard runtime dependencies, not optional ones, but
# importing them costs about a second and nothing that merely reads a decision function
# or a metric needs them. The roster import is deferred to keep the scorer from importing
# the catalogue that imports it.
"gatekeeper/scoring/encoder.py" = ["PLC0415"]
# The two model-driving scripts set GATEKEEPER_* in the environment before importing
# anything that reads config, which is only possible after argument parsing.
"scripts/probe_label_order.py" = ["PLC0415"]
"scripts/replay_bakeoff.py" = ["PLC0415"]
"scripts/export_replay_corpus.py" = ["PLC0415"]
# The Firestore query builder is imported inside `stream_edges` so the rest of the module
# — the field map, the record shape, the JSONL round trip — stays importable without the
# SDK, which is what lets the exporter's logic be tested without an emulator.
"gatekeeper/replay/corpus.py" = ["PLC0415"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q --strict-markers"
markers = [
    "emulator: requires the local Firestore emulator (FIRESTORE_EMULATOR_HOST)",
    "neo4j: requires the local Neo4j container",
]
